<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
    <style>
    table {
        border-collapse: collapse;
        margin: 20px 0;
        width: 60%;
    }

    th, td {
        border: 1px solid #333;
        padding: 8px 12px;
        text-align: center;
    }

    th {
        background-color: #419fd8;
        color: white;
    }

    tr:nth-child(even) {
        background-color: #f2f2f2;
    }
</style>
</head>
<body>
    <h1>Simple Calculator</h1>
    <script src="calculator.js"></script>
</body>


</html>
